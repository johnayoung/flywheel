# Cargo workspace for flywheel.
#
# One crate per layer, the dependency arrow pointing one way only (core
# imports nothing downstream). Intra-workspace dependencies carry both a
# `path` and a `version` so every crate is publishable.
#
#   crates/flywheel-agents        multi-agent execution layer (below core)
#   crates/flywheel-core          the lifecycle of a SINGLE task
#   crates/flywheel-orchestrator  many tasks: DAG, claims, work sources
#   crates/flywheel-worktree      git-worktree submit strategy + worker
#   crates/flywheel-container     Docker sandbox execution backend
#   crates/flywheel               the `flywheel` / `fw` product shell
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/johnayoung/flywheel"
homepage = "https://github.com/johnayoung/flywheel"
readme = "README.md"
keywords = ["ai", "agents", "orchestration", "claude", "automation"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
flywheel-agents = { path = "crates/flywheel-agents", version = "0.6.1" }
flywheel-core = { path = "crates/flywheel-core", version = "0.6.1" }
flywheel-orchestrator = { path = "crates/flywheel-orchestrator", version = "0.6.1" }
flywheel-worktree = { path = "crates/flywheel-worktree", version = "0.6.1" }
flywheel-container = { path = "crates/flywheel-container", version = "0.6.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "signal"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
regex = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
