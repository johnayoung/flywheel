[package]
name = "flywheel-hub"
description = "flywheel hub: the web workspace for AI coding agents -- server-owned PTY sessions, workspaces of git repos, and the browser UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["net"] }
axum = { version = "0.8", features = ["ws"] }
portable-pty = "0.9"
# Server-side terminal emulation (snapshots on attach, rendered text).
# Pinned: `vt.rs` relies on its swap_alt/grid internals behaving as tested.
alacritty_terminal = { version = "=0.26.0", default-features = false }
# The same character widths `alacritty_terminal` uses (combining-mark cap).
unicode-width = "0.2"
sha2.workspace = true
getrandom = "0.3"
subtle = "2.6"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Terminal QR codes for `fw hub url --qr` (encoder only; no image backends).
qrcode = { version = "0.14", default-features = false }
# Push notifications (ntfy-style webhooks): one HTTP/1.1 POST over
# rustls on ring with the platform's roots, as the rest of the workspace
# does TLS. `rustls-no-provider` keeps aws-lc-rs out; the notifier hands
# reqwest a ring `ClientConfig`, and `fw hub serve` installs ring as the
# process default for any other client (see `install_crypto_provider`).
rustls.workspace = true
rustls-native-certs.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
url = "2"
percent-encoding = "2"
toml.workspace = true
# `fw hub attach` (terminal client) and `fw hub wait`: the hub's WebSocket
# API as a client (TLS for a remote https hub via tokio-rustls on ring),
# and the session picker UI.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile.workspace = true
# Decodes the rendered terminal QR code back to its text in tests.
rqrr = "0.10"
tokio-tungstenite = "0.29"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query"] }
