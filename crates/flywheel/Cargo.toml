[package]
name = "flywheel"
description = "flywheel: the unified product shell -- the `flywheel` / `fw` verbs and the operator console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[[bin]]
name = "flywheel"
path = "src/main.rs"

[[bin]]
name = "fw"
path = "src/bin/fw.rs"

[dependencies]
flywheel-core.workspace = true
flywheel-agents.workspace = true
flywheel-orchestrator.workspace = true
flywheel-worktree.workspace = true
flywheel-container.workspace = true
flywheel-hub.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
rusqlite.workspace = true
toml.workspace = true
clap.workspace = true
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# The hub's events WebSocket in the Flywheel panel's end-to-end test.
tungstenite = "0.29"
rusqlite.workspace = true
# Token hashes and random markers in the account-pauses in-loop test.
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
# Drives `fw hub attach` inside a real terminal in its end-to-end test.
portable-pty = "0.9"
