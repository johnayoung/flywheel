[package]
name = "flywheel"
description = "flywheel: the unified product shell -- the `flywheel` / `fw` verbs and the operator console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[[bin]]
name = "flywheel"
path = "src/main.rs"

[[bin]]
name = "fw"
path = "src/bin/fw.rs"

[dependencies]
flywheel-core.workspace = true
flywheel-agents.workspace = true
flywheel-orchestrator.workspace = true
flywheel-worktree.workspace = true
flywheel-container.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
toml.workspace = true
clap.workspace = true
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
