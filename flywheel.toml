# Flywheel work policy: where work comes from and where runtime state lives.
# Committed with the repo; CLI flags always override.

[source]
kind = "directory"
tasks_dir = ".flywheel/tasks"

[paths]
db = ".flywheel/flywheel.sqlite"
sandbox_root = ".flywheel/worktrees"

[agent]
model = "claude-opus-4-8"

# Worker pool: how many tasks one worker process drives in parallel (default 1).
# >1 relies on each task's conflict_keys to keep concurrent work off shared
# files; --concurrency overrides per run.
[worker]
concurrency = 3

# Phase-exit integration gate (spec 00035): the full repo gate runs against
# the merged phase base before a completed phase archives; non-zero exit
# leaves the phase active.
[phase]
verify = "scripts/check.sh"

# Execute-time held-out landing gate (specs 00050/00051/00057). The committed
# pointer activates the gate for the orchestrator; the payload it names
# (per-task registrations + oracles) lives under the already git-ignored
# .flywheel/verification/ tree, so it never materializes into an agent worktree.
[held_out]
root = ".flywheel/verification/held-out"

# Default graders for work items that declare none (tracker sources only;
# directory task files always declare their own).
# [[defaults.graders]]
# type = "command"
# run = "uv run pytest"
