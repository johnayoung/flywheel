[project]
name = "flywheel-cli"
version = "0.1.0"
description = "Unified `fw` command router: delegates to the existing single-task, orchestrator, worker, TUI, and audit entry points."
requires-python = ">=3.13"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
dependencies = [
    "flywheel",
    "flywheel-orchestrator",
    "flywheel-worktree",
    "flywheel-tui",
]

[project.scripts]
fw = "flywheel_cli._cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
