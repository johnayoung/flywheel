[project]
name = "flywheel-container"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Container (Docker) sandbox backend for flywheel-orchestrator: runs the task agent CLI inside a container against a bind-mounted worktree."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
# SDK-free by design (00036 / spec 00044): the agent runs as its CLI inside the
# container image, so this package shells out to `docker` and never imports
# claude-agent-sdk. It is a sibling consumer of the orchestrator, like
# flywheel-worktree.
dependencies = [
    "flywheel-orchestrator>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
