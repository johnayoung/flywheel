[project]
name = "flywheel-core"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Production-grade orchestration loop for AI coding agents — owns the lifecycle of a single task."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
# Core's data shapes (Task, Lifecycle, graders, envelopes, store) need no
# agent SDK; only *driving* an agent does. The SDK is therefore an optional
# extra (see flywheel_core._sdk) so `import flywheel_core` is dependency-light.
dependencies = []

[project.optional-dependencies]
agents = [
    "flywheel-agents>=0.1.0",
]
claude = [
    "claude-agent-sdk>=0.2.83",
]
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
