[project]
name = "flywheel-orchestrator"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Multi-task orchestration layer built on flywheel: selection, dependency DAG, claims, multi-worker leasing."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
dependencies = [
    "flywheel-core>=0.1.0",
]

# Console script removed in the unified-CLI cutover: the orchestrator's verbs
# are now invoked through the product ``flywheel`` / ``fw`` shell, and the
# module remains runnable as ``python -m flywheel_orchestrator`` plumbing.

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
