[project]
name = "flywheel-tui"
version = "0.1.0"
description = "Interactive terminal console (Textual) for flywheel-orchestrator."
requires-python = ">=3.13"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
dependencies = [
    "flywheel-orchestrator",
    "textual>=0.85",
]

[project.scripts]
flywheel-tui = "flywheel_tui._cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
