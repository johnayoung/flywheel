[project]
name = "flywheel-worktree"
version = "0.1.0"
description = "Git-worktree submit strategy and reference worker for flywheel-orchestrator."
requires-python = ">=3.13"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
dependencies = [
    "flywheel-orchestrator",
]

[project.scripts]
flywheel-worktree = "flywheel_worktree.worker:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
