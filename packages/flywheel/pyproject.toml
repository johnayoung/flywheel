[project]
name = "flywheel"
version = "0.1.0"
description = "Production-grade orchestration loop for AI coding agents — owns the lifecycle of a single task."
requires-python = ">=3.13"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
dependencies = [
    "claude-agent-sdk>=0.2.83",
]

[project.scripts]
flywheel = "flywheel.workflow:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
