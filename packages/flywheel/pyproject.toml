[project]
name = "flywheel"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Unified `flywheel` / `fw` command router and operator console: dashboard + session screen + persistent input bar; delegates verbs to the core single-task, orchestrator, and worker implementations."
requires-python = ">=3.13"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
dependencies = [
    # The product shell drives real agents, so it pins the claude extra:
    # installing `flywheel` yields a working out-of-box agent loop.
    "flywheel-core[claude]>=0.1.0",
    "flywheel-orchestrator>=0.1.0",
    "flywheel-worktree>=0.1.0",
    # The container backend ([sandbox] backend = "container") ships turnkey in
    # the product so `flywheel worker` can run it from flywheel.toml alone.
    "flywheel-container>=0.1.0",
    "textual>=0.85",
]

[project.scripts]
flywheel = "flywheel._cli:main"
fw = "flywheel._cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
