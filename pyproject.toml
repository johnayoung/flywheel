[project]
name = "flywheel"
version = "0.1.0"
description = "Production-grade orchestration loop for AI coding agents."
readme = "README.md"
authors = [
    { name = "John Young", email = "john.anto.young@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.83",
]

[project.scripts]
flywheel = "flywheel.workflow:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "testcontainers>=4.0",
]
